<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juju · Bientôt disponible</title>
  <meta name="description" content="Juju, ta garde-robe virtuelle. Disponible bientôt.">
  <meta property="og:title" content="Juju · Garde-robe virtuelle">
  <meta property="og:description" content="Numérise ton dressing. Essaye virtuellement. Bientôt disponible.">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background-color: #0A0A0F;
      color: #F5F0E8;
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 800px; height: 800px;
      max-width: 90vw; max-height: 90vw;
      background: radial-gradient(circle, rgba(94, 45, 145, 0.18) 0%, transparent 70%);
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }
    main {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 2rem;
      position: relative; z-index: 1;
      text-align: center;
    }
    .wordmark {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 600;
      font-size: clamp(5rem, 18vw, 9rem);
      color: #D4AF37;
      letter-spacing: 0.02em;
      line-height: 1;
      margin-bottom: 1.5rem;
    }
    .tagline {
      color: #F5F0E8;
      font-size: clamp(1rem, 3vw, 1.25rem);
      font-weight: 400;
      margin-bottom: 0.75rem;
      max-width: 32rem;
    }
    .subtagline {
      color: #A19FB0;
      font-size: clamp(0.875rem, 2.5vw, 1rem);
      max-width: 32rem;
      line-height: 1.6;
    }
    .badge {
      margin-top: 3rem;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.55rem 1.1rem;
      border: 1px solid #2A2F5C;
      border-radius: 999px;
      font-size: 0.7rem;
      color: #A19FB0;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .badge::before {
      content: '';
      width: 6px; height: 6px;
      background: #D4AF37;
      border-radius: 50%;
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }
    footer {
      padding: 1.5rem 2rem;
      text-align: center;
      color: #A19FB0;
      font-size: 0.75rem;
      position: relative;
      z-index: 1;
    }
    footer a {
      color: #D4AF37;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    footer a:hover { opacity: 0.7; }
  </style>
</head>
<body>
  <main>
    <h1 class="wordmark">Juju</h1>
    <p class="tagline">Ta garde-robe, sur toi, sans bouger de ton lit.</p>
    <p class="subtagline">Numérise ton dressing. Filtre, organise, essaye virtuellement.</p>
    <span class="badge">Bientôt disponible</span>
  </main>
  <footer>
    Un projet de <a href="https://julienmichaux.com">Julien Michaux</a> · 2026
  </footer>
</body>
</html>
